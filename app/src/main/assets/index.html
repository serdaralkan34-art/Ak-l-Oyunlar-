
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10233f">
<title>Akıl Oyunları</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5fb;color:#17243a;font-family:Arial,sans-serif}
header{background:#10233f;color:white;padding:22px 18px 25px;border-radius:0 0 28px 28px}
.brand{font-size:25px;font-weight:800}
.sub{font-size:13px;color:#cbd5e1;margin-top:8px}
nav{display:flex;gap:10px;margin-top:20px}
button{border:0;border-radius:13px;padding:13px 17px;font-size:15px;background:#e5edf7;color:#17243a}
button.active{background:#16a36a;color:white}
main{padding:16px}
.datebar{display:flex;align-items:center;justify-content:space-between;margin:12px 0 18px}
.datebar button{font-size:20px;padding:10px 16px}
input{border:1px solid #d8e0eb;border-radius:12px;padding:11px;font-size:15px;background:white;color:#17243a}
.info,.match,.empty{background:white;border:1px solid #dce4ee;border-radius:20px;padding:17px;margin-bottom:13px}
.info{font-size:13px;color:#64748b}
.matchtop{display:flex;justify-content:space-between;gap:8px;color:#64748b;font-size:13px;margin-bottom:15px}
.teams{font-size:17px;font-weight:700;line-height:1.5}
.score{font-size:23px;font-weight:800;margin-top:8px}
.status{font-size:12px;font-weight:700;color:#16875c}
.status.live{color:#d32f2f}
.time{font-size:13px;color:#64748b;margin-top:9px}
.empty{text-align:center;color:#64748b;padding:30px 18px}
.footer{text-align:center;color:#64748b;font-size:12px;padding:20px}
.small{font-size:12px;color:#64748b}
a{color:#16875c}
</style>
</head>
<body>
<header>
  <div class="brand">♞ AKIL OYUNLARI</div>
  <div class="sub">Maç zekâsı • İstatistik • Olasılık</div>
  <nav>
    <button id="football" class="active" onclick="changeSport('football')">⚽ Futbol</button>
    <button id="basketball" onclick="changeSport('basketball')">🏀 Basketbol</button>
  </nav>
</header>

<main>
  <div class="datebar">
    <button onclick="moveDate(-1)">‹</button>
    <input id="date" type="date">
    <button onclick="moveDate(1)">›</button>
  </div>

  <div class="info" id="info">
    Gerçek maç verileri yükleniyor...
  </div>

  <div id="matches"></div>

  <div class="footer">
    Veri kaynağı:
    <a href="https://sportscore.com/developers/" target="_blank">Powered by SportScore</a>
    <br><br>
    Akıl Oyunları • Canlı veri test sürümü
  </div>
</main>

<script>
let sport="football";
let refreshTimer=null;
let requestNumber=0;

const dateInput=document.getElementById("date");
const matchArea=document.getElementById("matches");
const info=document.getElementById("info");

function localDate(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

dateInput.value=localDate();

function moveDate(amount){
  const d=new Date(dateInput.value+"T12:00:00");
  d.setDate(d.getDate()+amount);
  dateInput.value=[
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
  loadMatches();
}

function changeSport(value){
  sport=value;
  document.getElementById("football").classList.toggle("active",sport==="football");
  document.getElementById("basketball").classList.toggle("active",sport==="basketball");
  loadMatches();
}

function findMatches(data){
  if(Array.isArray(data))return data;
  if(!data || typeof data!=="object")return [];
  for(const key of ["matches","fixtures","data","results","events"]){
    if(Array.isArray(data[key]))return data[key];
    if(data[key] && typeof data[key]==="object"){
      const found=findMatches(data[key]);
      if(found.length)return found;
    }
  }
  return [];
}

function getValue(obj,keys,fallback=""){
  for(const key of keys){
    if(obj[key]!==undefined && obj[key]!==null && obj[key]!=="")return obj[key];
  }
  return fallback;
}

function statusText(m){
  const raw=String(getValue(m,["status","state","match_status"],"")).toLowerCase();
  const label=String(getValue(m,["status_text","statusText","minute","time_status"],"")).trim();
  if(raw.includes("live") || raw==="inplay" || raw==="1")return {text:label||"CANLI",live:true};
  if(raw.includes("finish") || raw==="ft" || raw==="ended" || raw==="complete")return {text:label||"MS",live:false};
  if(raw.includes("half") || raw==="ht")return {text:label||"İY",live:true};
  return {text:label||"Başlamadı",live:false};
}

function renderMatches(list){
  if(!list.length){
    matchArea.innerHTML='<div class="empty">Bu tarih ve spor için sağlayıcıdan maç verisi gelmedi. Başka bir tarih deneyebilirsin.</div>';
    return;
  }

  list.sort((a,b)=>{
    const ta=new Date(getValue(a,["time","date","datetime","start_time"],0)).getTime()||0;
    const tb=new Date(getValue(b,["time","date","datetime","start_time"],0)).getTime()||0;
    return ta-tb;
  });

  matchArea.innerHTML=list.map(m=>{
    const home=getValue(m,["home","home_team","homeTeam","localteam_name","team_home"],"Ev sahibi");
    const away=getValue(m,["away","away_team","awayTeam","awayteam_name","team_away"],"Deplasman");
    const hs=getValue(m,["home_score","homeScore","score_home"],null);
    const as=getValue(m,["away_score","awayScore","score_away"],null);
    const league=getValue(m,["competition","league","tournament","competition_name"],"Karşılaşma");
    const time=getValue(m,["time","datetime","date","start_time"],"");
    const state=statusText(m);
    const score=(hs!==null || as!==null)?`${hs??"-"} – ${as??"-"}`:"";
    let displayTime="";
    if(time){
      const d=new Date(time);
      if(!isNaN(d.getTime()))displayTime=d.toLocaleString("tr-TR",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"short"});
      else displayTime=String(time);
    }
    return `<article class="match">
      <div class="matchtop"><span>${escapeHTML(league)}</span>
      <span class="status ${state.live?"live":""}">${escapeHTML(state.text)}</span></div>
      <div class="teams">${escapeHTML(home)} – ${escapeHTML(away)}</div>
      ${score?`<div class="score">${escapeHTML(score)}</div>`:""}
      <div class="time">${displayTime?"Karşılaşma zamanı: "+escapeHTML(displayTime):""}</div>
    </article>`;
  }).join("");
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

async function loadMatches(){
  const current=++requestNumber;
  const selectedDate=dateInput.value;
  info.textContent="Gerçek maç verileri alınıyor...";
  matchArea.innerHTML='<div class="empty">Maçlar yükleniyor...</div>';

  const url=`https://sportscore.com/api/v1/fixtures/?sport=${sport}&date=${encodeURIComponent(selectedDate)}&limit=200`;

  try{
    const response=await fetch(url,{method:"GET",cache:"no-store"});
    if(!response.ok)throw new Error("Veri sağlayıcısı HTTP "+response.status+" yanıtı verdi.");
    const data=await response.json();
    if(current!==requestNumber)return;

    const list=findMatches(data);
    renderMatches(list);

    const updated=new Date().toLocaleTimeString("tr-TR");
    info.textContent=`${sport==="football"?"Futbol":"Basketbol"} • ${selectedDate} • ${list.length} maç • Son kontrol: ${updated}`;
  }catch(error){
    if(current!==requestNumber)return;
    info.textContent="Veri bağlantısı kurulamadı: "+error.message;
    matchArea.innerHTML='<div class="empty">Şu anda gerçek maç verisi alınamıyor. İnternet bağlantısını kontrol edip Yenile düğmesini kullan.</div><button onclick="loadMatches()">Yeniden dene</button>';
  }
}

dateInput.addEventListener("change",loadMatches);

function startRefresh(){
  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(()=>{
    if(document.visibilityState==="visible")loadMatches();
  },60000);
}

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible")loadMatches();
});

loadMatches();
startRefresh();
</script>
</body>
</html>
